<!DOCTYPE html>

<html>

<head>

<title>Edit Question</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body>

<div class="container">

<h1>Edit Question</h1>

<form method="POST">

<p>Question</p>

<textarea
name="question"
rows="4"
required>{{ question.question }}</textarea>

<h3>Answers</h3>

<table style="width:100%;">

<tr>
    <th>Correct</th>
    <th>Answer</th>
</tr>

<tr>

<td>
<input
type="radio"
name="correct_option"
value="1"
{% if question.correct == question.option1 %}checked{% endif %}
required>
</td>

<td>
<input
type="text"
name="option1"
value="{{ question.option1 }}"
required>
</td>

</tr>

<tr>

<td>
<input
type="radio"
name="correct_option"
value="2"
{% if question.correct == question.option2 %}checked{% endif %}>
</td>

<td>
<input
type="text"
name="option2"
value="{{ question.option2 }}"
required>
</td>

</tr>

<tr>

<td>
<input
type="radio"
name="correct_option"
value="3"
{% if question.correct == question.option3 %}checked{% endif %}>
</td>

<td>
<input
type="text"
name="option3"
value="{{ question.option3 }}">
</td>

</tr>

<tr>

<td>
<input
type="radio"
name="correct_option"
value="4"
{% if question.correct == question.option4 %}checked{% endif %}>
</td>

<td>
<input
type="text"
name="option4"
value="{{ question.option4 }}">
</td>

</tr>

</table>

<select name="question_type">

<option value="multiple_choice"
{% if question.question_type=="multiple_choice" %}selected{% endif %}>
Multiple Choice
</option>

<option value="true_false"
{% if question.question_type=="true_false" %}selected{% endif %}>
True / False
</option>

</select>

<p>Display Order</p>

<input
type="number"
name="display_order"
value="{{ question.display_order }}"
required>

<p>Image URL (optional)</p>

<input
type="text"
name="image_url"
value="{{ question.image_url or '' }}">

<p>Explanation (optional)</p>

<textarea
name="explanation"
rows="4">{{ question.explanation or '' }}</textarea>

<br><br>

<button class="btn btn-open">

Update Question

</button>

</form>

</div>

</body>

</html>
