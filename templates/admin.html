<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>

<h1>Admin Dashboard</h1>

<a href="/download-csv">Download CSV</a>
|
<a href="/logout">Logout</a>

<br><br>

<table border="1" cellpadding="10">

<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Score</th>
    <th>Total</th>
    <th>Percentage</th>
    <th>Date</th>
    <th>Review</th>
</tr>

{% for r in results %}
<tr>
    <td>{{ r.name }}</td>
    <td>{{ r.email }}</td>
    <td>{{ r.score }}</td>
    <td>{{ r.total }}</td>
    <td>{{ r.percentage }}%</td>
    <td>{{ r.date }}</td>
    <td>
        <a href="/review/{{ r.id }}">View</a>
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
