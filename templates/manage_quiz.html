<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Quizzes</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

<div class="container">

<header>

<h1>Quiz Management</h1>

<div class="header-links">
    <a href="/admin">Dashboard</a>
    <a href="/logout">Logout</a>
</div>

</header>

<section>

<h2>Available Quizzes</h2>

<table>

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Description</th>
    <th>Open</th>
    <th>Active</th>
    <th>Actions</th>
</tr>

{% for quiz in quizzes %}

<tr>

<td>{{ quiz.id }}</td>

<td>{{ quiz.title }}</td>

<td>{{ quiz.description }}</td>

<td>{{ quiz.quiz_open }}</td>

<td>
    {{ quiz.is_active }}

    {% if quiz.is_active %}
    <br><br>

    <form action="/deactivate-quiz/{{ quiz.id }}" method="POST">
        <button class="btn btn-close">
            Deactivate
        </button>
    </form>

    {% else %}
    <br><br>

    <form action="/activate-quiz/{{ quiz.id }}" method="POST">
        <button class="btn btn-open">
            Activate
        </button>
    </form>

    {% endif %}
</td>

<td>

<button disabled>Edit</button>

<a href="/manage-questions/{{ quiz.id }}">
    <button>Questions</button>
</a>

</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/create-quiz">
    <button class="btn btn-open">
        Create New Quiz
    </button>
</a>

</section>

</div>

</body>

</html>
